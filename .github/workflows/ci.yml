name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # lib/ is a committed build artifact (immutable installs without build
      # scripts); fail the PR when it drifts from a fresh build of src/.
      - name: lib must match a fresh build
        run: git diff --exit-code -- lib/ || (echo "::error::committed lib/ differs from a fresh build of src/ — run pnpm build and commit the artifact"; exit 1)